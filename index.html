<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NODe Hub</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <link rel="stylesheet" href="game.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div id="logo">NODe</div>
    <div class="subtitle">Runtime 0.1 pre-alpha</div>
  </div>
  <div class="actions" id="authArea">
    <!-- Filled by JS -->
  </div>
</header>

<main class="page">
  <section class="hero">
    <h1>NODe Games</h1>
    <p>Sign in to upload your .nrf games.</p>
  </section>

  <section id="uploadPanel" class="upload-panel" style="display:none;">
    <h2>Upload Game</h2>

    <div class="form-row">
      <label class="small">Select a .nrf file</label>
      <input type="file" id="fileInput" accept=".nrf">
    </div>

    <button id="uploadBtn" class="btn primary">Upload</button>
    <span id="uploadStatus" class="small"></span>

    <div id="preview" class="preview"></div>
  </section>

  <section>
    <h2>Games</h2>
    <div id="gamesGrid" class="grid"></div>
  </section>
</main>

<footer class="foot">© NODe Platform</footer>

<!-- Auth Modal -->
<div id="modal"
     style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;
            background:rgba(0,0,0,.5);align-items:center;justify-content:center;">
  <div style="background:white;padding:20px;border-radius:6px;width:300px;">
    <h3 id="modalTitle">Sign In</h3>

    <div class="form-row">
      <input id="email" class="input" type="email" placeholder="Email">
    </div>
    <div class="form-row">
      <input id="password" class="input" type="password" placeholder="Password">
    </div>

    <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
      <button id="modalCancel" class="btn">Cancel</button>
      <button id="modalSubmit" class="btn primary">OK</button>
    </div>

    <div id="modalMsg" class="small error"></div>
  </div>
</div>

<script>
// ---------- Supabase config ----------
const SUPABASE_URL = "https://rowzonuulxhiefncbwnp.supabase.co";
const SUPABASE_ANON =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvd3pvbnV1bHhoaWVmbmNid25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2Mzg4MzMsImV4cCI6MjA3OTIxNDgzM30.UY_kvKySXU0ExfC8lU-m3QkF7wIAXW_YTg-VaKbWL3U";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
// ------------------------------------

// Elements
const authArea = document.getElementById("authArea");
const uploadPanel = document.getElementById("uploadPanel");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");
const preview = document.getElementById("preview");
const gamesGrid = document.getElementById("gamesGrid");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalMsg = document.getElementById("modalMsg");
const modalSubmit = document.getElementById("modalSubmit");
const modalCancel = document.getElementById("modalCancel");
const emailInput = document.getElementById("email");
const passInput = document.getElementById("password");

let modalMode = "signin";

function showModal(mode) {
  modalMode = mode;
  modalTitle.textContent = (mode === "signin") ? "Sign In" : "Create Account";
  modalMsg.textContent = "";
  emailInput.value = "";
  passInput.value = "";
  modal.style.display = "flex";
}

modalCancel.onclick = () => {
  modal.style.display = "none";
};

// signup/signin handler
modalSubmit.onclick = async () => {
  const email = emailInput.value.trim();
  const pass = passInput.value;

  if (!email || !pass) {
    modalMsg.textContent = "Email + password required";
    return;
  }

  try {
    if (modalMode === "signup") {
      const { error: signUpErr } = await sb.auth.signUp({
        email,
        password: pass,
        options: { emailRedirectTo: undefined }
      });
      if (signUpErr) {
        modalMsg.textContent = signUpErr.message;
        return;
      }
      await sb.auth.signInWithPassword({ email, password: pass });
    } else {
      const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: pass });
      if (signInErr) {
        modalMsg.textContent = signInErr.message;
        return;
      }
    }

    modal.style.display = "none";
  } catch (e) {
    modalMsg.textContent = e.message || "Auth error";
  }
};

// Auth UI refresh
async function refreshAuthUI() {
  const { data: sessionData } = await sb.auth.getSession();
  const user = sessionData?.session?.user;

  if (!user) {
    authArea.innerHTML = `
      <button id="btnSignUp" class="btn">Sign up</button>
      <button id="btnSignIn" class="btn primary">Sign in</button>
    `;
    uploadPanel.style.display = "none";

    document.getElementById("btnSignUp").onclick = () => showModal("signup");
    document.getElementById("btnSignIn").onclick = () => showModal("signin");
  } else {
    authArea.innerHTML = `
      <div class="small">Signed in: ${user.email}</div>
      <button id="btnSignOut" class="btn">Sign out</button>
    `;
    uploadPanel.style.display = "block";

    document.getElementById("btnSignOut").onclick = async () => {
      await sb.auth.signOut();
    };
  }
}

// FORCE UI refresh every 0.5s so it always updates
setInterval(refreshAuthUI, 500);

// Upload NRF
uploadBtn.onclick = async () => {
  uploadStatus.textContent = "";
  preview.textContent = "";

  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.textContent = "Pick a file.";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".nrf")) {
    uploadStatus.textContent = "Only .nrf files allowed.";
    return;
  }

  const { data: sessionData } = await sb.auth.getSession();
  const user = sessionData?.session?.user;
  if (!user) {
    uploadStatus.textContent = "Sign in first.";
    return;
  }

  const path = `games/${user.id}/${Date.now()}_${file.name}`;
  uploadStatus.textContent = "Uploading...";

  const { error: upErr } = await sb.storage.from("games").upload(path, file);
  if (upErr) {
    uploadStatus.textContent = "Upload failed: " + upErr.message;
    return;
  }

  const { error: dbErr } = await sb.from("games").insert([{
    title: file.name.replace(/\.nrf$/i, ""),
    description: "NODe Game",
    filename: file.name,
    storage_path: path,
    uploader: user.id,
    uploader_email: user.email,
    version: "N/A",
    runtime_version: "0.1"
  }]);

  if (dbErr) {
    uploadStatus.textContent = "DB error: " + dbErr.message;
    return;
  }

  uploadStatus.textContent = "Uploaded!";
  preview.textContent = file.name + " uploaded.";
  loadGames();
};

// Load game list
async function loadGames() {
  const { data, error } = await sb
    .from("games")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    gamesGrid.textContent = "Error loading games";
    return;
  }

  if (!data || !data.length) {
    gamesGrid.textContent = "No games yet.";
    return;
  }

  gamesGrid.innerHTML = "";
  for (const g of data) {
    const { data: pub } = sb.storage.from("games").getPublicUrl(g.storage_path);
    const url = pub.publicUrl;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb">📦</div>
      <div class="meta">
        <div class="title">${g.title}</div>
        <div class="desc">by ${g.uploader_email}</div>
        <a class="dl" href="${url}" download>Download</a>
      </div>
    `;
    gamesGrid.appendChild(card);
  }
}

// Initial load
loadGames();

</script>
</body>
</html>
