<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODe Platform</title>
  <link rel="stylesheet" href="game.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1>NODe Platform</h1>
    <nav>
      <button class="tab-btn active" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="account">Account</button>
    </nav>
  </header>

  <main>
    <section id="home" class="tab active">
      <h2>Welcome to NODe</h2>
      <p>Create and play adventure-based games with the NODe SDK and Runtime.</p>
      <button id="github-login" class="button">Sign in with GitHub</button>
    </section>

    <section id="users" class="tab">
      <h2>Users</h2>
      <ul id="users-list">Loading users...</ul>
    </section>

    <section id="account" class="tab">
      <div id="signin-form" class="auth-box">
        <h2>Sign In</h2>
        <input type="email" id="signin-email" placeholder="Email" class="input">
        <input type="password" id="signin-password" placeholder="Password" class="input">
        <button id="signin-btn" class="button">Sign In</button>
        <p>Don’t have an account? <a id="show-signup">Sign Up</a></p>
      </div>

      <div id="signup-form" class="auth-box" style="display:none;">
        <h2>Sign Up</h2>
        <input type="text" id="signup-username" placeholder="Username" class="input">
        <input type="email" id="signup-email" placeholder="Email" class="input">
        <input type="password" id="signup-password" placeholder="Password" class="input">
        <button id="signup-btn" class="button">Create Account</button>
        <p>Already have an account? <a id="show-signin">Sign In</a></p>
      </div>

      <div id="account-info" class="auth-box" style="display:none;">
        <h2>Your Account</h2>
        <p>Email: <span id="user-email"></span></p>
        <input type="text" id="user-username" class="input">
        <button id="update-username" class="button">Update Username</button>
        <button id="logout-btn" class="button danger">Log Out</button>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Opposing Studio. All Rights Reserved.</p>
  </footer>
</body>
</html>
