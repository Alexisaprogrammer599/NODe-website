<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>NODe Hub — Games</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="game.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div id="logo">NODe</div>
    <div class="subtitle">Runtime 0.1 pre-alpha</div>
  </div>
  <div class="actions">
    <a id="loginBtn" class="btn primary">Login with GitHub</a>
    <span id="user"></span>
  </div>
</header>

<main class="page">
  <section class="hero">
    <h1>Featured Games</h1>
    <p>Upload, share, and download NODe adventure packages.</p>
  </section>

  <section class="upload-panel" id="uploadPanel" style="display:none;">
    <h2>Upload a game</h2>
    <input type="file" id="fileInput" accept=".nrf,.zip">
    <div>
      <button class="btn primary" id="uploadBtn">Validate & Upload</button>
      <span id="uploadStatus"></span>
    </div>
    <div id="preview" class="preview"></div>
  </section>

  <section>
    <h2>All Games</h2>
    <div id="gamesGrid" class="grid"></div>
  </section>
</main>

<footer class="foot">© NODe — OG Platform Theme</footer>

<script>
/* CONFIG - replace VERCEL_URL with your deployed Vercel URL if different */
const CLIENT_ID = "Ov23li5lWi8G41RLWojz"; // public
const USERNAME = "Alexisaprogrammer599";
const REPO = "NODe-website";
const VERCEL_URL = "https://node-website-git-main-alexisaprogrammer599s-projects.vercel.app";

/* --- OAuth link --- */
document.getElementById("loginBtn").href =
  `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=repo`;

/* exchange code via Vercel auth endpoint */
const urlCode = new URLSearchParams(window.location.search).get("code");
if (urlCode) {
  fetch(`${VERCEL_URL}/api/auth?code=${urlCode}`)
    .then(r => r.json())
    .then(data => {
      if (data.access_token) {
        localStorage.setItem("gh_token", data.access_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        initLoggedIn();
      } else {
        console.error("Auth error", data);
      }
    });
}

function initLoggedIn() {
  const token = localStorage.getItem("gh_token");
  if (token) {
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("user").innerText = "Logged in";
    document.getElementById("uploadPanel").style.display = "block";
  }
}

initLoggedIn();

/* load games listing from GitHub /games folder */
function loadGames() {
  fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/games`)
    .then(r => r.json())
    .then(files => {
      const grid = document.getElementById("gamesGrid");
      grid.innerHTML = "";
      if (!Array.isArray(files)) {
        grid.innerHTML = "<div class='note'>No games found.</div>";
        return;
      }
      files.forEach(f => {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="thumb">📦</div>
          <div class="meta">
            <div class="title">${f.name}</div>
            <div class="desc">NODe package</div>
            <a class="dl" href="${f.download_url}" target="_blank">Download</a>
          </div>
        `;
        grid.appendChild(el);
      });
    });
}
loadGames();

/* Validate + Upload logic */
document.getElementById("uploadBtn").addEventListener("click", async () => {
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("uploadStatus");
  const preview = document.getElementById("preview");
  preview.innerText = "";
  status.innerText = "";

  if (!file) { status.innerText = "Pick a file first."; return; }
  if (!/\.(nrf|zip)$/i.test(file.name)) { status.innerText = "File must be .nrf or .zip"; return; }

  const arrBuf = await file.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(arrBuf)));

  status.innerText = "Validating...";

  const token = localStorage.getItem("gh_token");
  if (!token) { status.innerText = "You must log in first."; return; }

  const payload = {
    filename: file.name,
    content: b64,
    token: token,
    username: USERNAME,
    repo: REPO
  };

  const resp = await fetch(`${VERCEL_URL}/api/upload`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const jr = await resp.json();
  if (!resp.ok) {
    status.innerText = "Upload failed: " + (jr.error || jr.detail || JSON.stringify(jr));
    console.error(jr);
    return;
  }

  status.innerText = "Upload succeeded!";
  if (jr.metadata) {
    preview.innerHTML = `<div class="meta-preview"><strong>${jr.metadata.Gamename}</strong> by ${jr.metadata.CreatedBy}<br>v${jr.metadata.Version}</div>`;
  }

  loadGames();
});
</script>
</body>
</html>
