<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NODe Game Downloads</title>

<style>
    body { font-family: Arial; background:#111; color:#eee; margin:0; padding:0; }
    header { background:#1b1b1b; padding:20px; text-align:center; border-bottom:2px solid #333; }
    h1 { margin:0; font-size:32px; }
    .subtitle { color:#aaa; font-size:14px; margin-top:5px; }

    .container { width:90%; max-width:900px; margin:25px auto; }

    .btn { 
        background:#0d6efd; padding:10px 16px; border-radius:6px;
        color:white; text-decoration:none; display:inline-block; margin-top:10px;
    }
    .btn:hover { background:#0b5ed7; }

    .upload-box, .game-card {
        background:#1e1e1e; padding:16px; border-radius:10px; border:1px solid #333; margin-bottom:22px;
    }

    .file-input { margin-top:15px; }
    .game-card h2 { margin:0; font-size:22px; }
    .game-card p { margin:8px 0 12px 0; color:#ccc; }

    .download-btn {
        padding:10px 14px; border-radius:6px; background:#00a8ff; color:white;
        text-decoration:none; font-weight:bold;
    }
</style>
</head>

<body>
<header>
    <h1>NODe Downloads</h1>
    <div class="subtitle">Runtime 0.1 Pre-Alpha • Upload & Share Games</div>

    <a class="btn" id="loginBtn">Login with GitHub</a>
    <span id="user"></span>
</header>

<div class="container">

    <div class="upload-box" id="upload-section" style="display:none;">
        <h2>Upload a NODe Game (.nrf)</h2>
        <input id="fileInput" class="file-input" type="file" accept=".nrf,.zip">
        <br><br>
        <button class="btn" onclick="uploadFile()">Upload</button>
    </div>

    <h2>Available Downloads</h2>
    <div id="games"></div>

</div>

<script>
const CLIENT_ID = "YOUR_CLIENT_ID";
const USERNAME = "YOUR_GITHUB_USERNAME";
const REPO = "NODe-website";
const VERCEL_URL = "https://YOUR-VERCEL-PROJECT.vercel.app";

document.getElementById("loginBtn").href =
    `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=repo`;

const code = new URLSearchParams(window.location.search).get("code");

if (code) {
    fetch(`${VERCEL_URL}/api/auth?code=${code}`)
    .then(r => r.json())
    .then(data => {
        localStorage.setItem("token", data.access_token);
        window.location = "index.html";
    });
}

const token = localStorage.getItem("token");
if (token) {
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("user").innerText = "Logged In";
    document.getElementById("upload-section").style.display = "block";
}

function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("No file chosen.");

    const reader = new FileReader();
    reader.onload = function() {
        const content = btoa(reader.result);
        fetch(`${VERCEL_URL}/api/upload`, {
            method: "POST",
            body: JSON.stringify({
                filename: file.name,
                content: content,
                token: token,
                username: USERNAME,
                repo: REPO
            })
        })
        .then(r => r.json())
        .then(() => {
            alert("Uploaded!");
            loadGames();
        });
    };
    reader.readAsBinaryString(file);
}

function loadGames() {
    fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/games`)
        .then(r => r.json())
        .then(files => {
            const div = document.getElementById("games");
            div.innerHTML = "";
            files.forEach(f => {
                div.innerHTML += `
                    <div class="game-card">
                        <h2>${f.name}</h2>
                        <p>NODe Game File</p>
                        <a class="download-btn" href="${f.download_url}">Download</a>
                    </div>
                `;
            });
        });
}

loadGames();
</script>

</body>
</html>
