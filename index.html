<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NODe Platform</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>NODe Platform</h1>
    <nav>
      <button class="tab-btn" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="account">Account</button>
    </nav>
  </header>

  <main>
    <!-- Home -->
    <section id="home" class="tab active">
      <h2>Welcome to NODe</h2>
      <p>Create and play adventure-based games with the NODe engine.</p>
      <button id="github-login">Sign in with GitHub</button>
    </section>

    <!-- Users -->
    <section id="users" class="tab">
      <h2>Users</h2>
      <ul id="users-list">Loading...</ul>
    </section>

    <!-- Account -->
    <section id="account" class="tab">
      <div id="auth-container">
        <!-- Sign In -->
        <div id="signin-form">
          <h2>Sign In</h2>
          <input type="email" id="signin-email" placeholder="Email" />
          <input type="password" id="signin-password" placeholder="Password" />
          <button id="signin-btn">Sign In</button>
          <p>Don't have an account? <a id="show-signup">Sign Up</a></p>
        </div>

        <!-- Sign Up -->
        <div id="signup-form" style="display:none;">
          <h2>Sign Up</h2>
          <input type="text" id="signup-username" placeholder="Username" />
          <input type="email" id="signup-email" placeholder="Email" />
          <input type="password" id="signup-password" placeholder="Password" />
          <button id="signup-btn">Create Account</button>
          <p>Already have an account? <a id="show-signin">Sign In</a></p>
        </div>

        <!-- Account Info -->
        <div id="account-info" style="display:none;">
          <h2>Your Account</h2>
          <p>Email: <span id="user-email"></span></p>
          <label>Username:</label>
          <input type="text" id="user-username" />
          <button id="update-username">Update Username</button>
          <button id="logout-btn">Log Out</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Opposing Studio. All Rights Reserved.</p>
  </footer>
</body>
</html>
